<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening HMIS…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #06142e;
        color: #f8fafc;
      }
      .box {
        max-width: 440px;
        padding: 28px 32px;
        text-align: center;
        line-height: 1.5;
      }
      a {
        color: #ffd100;
      }
      .hint {
        font-size: 14px;
        opacity: 0.9;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p id="status">Signing in to HMIS…</p>
      <p class="hint" id="hint" hidden></p>
      <p><a id="manual" href="http://15.252.193.15:8080/hims-ui/#/login">Open HMIS login</a></p>
    </div>
    <script>
      var HMIS_ORIGIN = "http://15.252.193.15:8080";
      var HMIS_LOGIN = HMIS_ORIGIN + "/hims-ui/#/login";
      var HMIS_TOMCAT_SSO = HMIS_ORIGIN + "/hims-ui/malaysia-hmis-sso.html";
      var VERCEL_PROXY = "__VITE_HMIS_PROXY_BASE__";
      if (VERCEL_PROXY === "__VITE_HMIS_PROXY_BASE__") VERCEL_PROXY = "";
      var statusEl = document.getElementById("status");
      var hintEl = document.getElementById("hint");
      var manualEl = document.getElementById("manual");

      function proxiedSsoUrl() {
        if (VERCEL_PROXY) {
          return VERCEL_PROXY.replace(/\/$/, "") + "/hims-ui/malaysia-hmis-sso.html";
        }
        if (location.protocol !== "file:") {
          return location.origin + "/hims-ui/malaysia-hmis-sso.html";
        }
        return "";
      }

      function loginApiUrl() {
        if (location.hostname.indexOf("vercel.app") !== -1) {
          return "/api/hmis-login";
        }
        return HMIS_ORIGIN + "/TATA_postgres/loginaction/authuserlogin/";
      }

      function openManual() {
        statusEl.textContent = "Open HMIS and sign in with the demo account.";
        hintEl.hidden = false;
        hintEl.textContent = "User superadmin · Password 123 · Org CB · Unit TATA MD";
        manualEl.href = HMIS_LOGIN;
        location.replace(HMIS_LOGIN);
      }

      function tryTomcatSso() {
        return fetch(HMIS_TOMCAT_SSO, { method: "GET", mode: "cors" }).then(function (res) {
          if (res.ok) {
            location.replace(HMIS_TOMCAT_SSO);
            return true;
          }
          return false;
        }).catch(function () {
          return false;
        });
      }

      function tryProxiedSso() {
        var url = proxiedSsoUrl();
        if (!url) return Promise.resolve(false);
        location.replace(url);
        return Promise.resolve(true);
      }

      function tryPortalBridge() {
        return fetch(loginApiUrl(), {
          method: "GET",
          headers: { Accept: "application/json" },
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            if (!data.login_status || !data.access_token) {
              throw new Error(data.msg || "Login failed");
            }
            var proxied = proxiedSsoUrl();
            if (proxied) {
              var payload = btoa(JSON.stringify(data));
              location.replace(proxied + "#portalSession=" + encodeURIComponent(payload));
              return;
            }
            return tryTomcatSso().then(function (ok) {
              if (ok) return;
              openManual();
            });
          })
          .catch(function () {
            openManual();
          });
      }

      tryProxiedSso().then(function (used) {
        if (used) return;
        tryTomcatSso().then(function (ok) {
          if (ok) return;
          tryPortalBridge();
        });
      });
    </script>
  </body>
</html>
