<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening HMIS…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #06142e;
        color: #f8fafc;
      }
      .box {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      a {
        color: #ffd100;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p id="status">Signing in to HMIS…</p>
      <p><a id="manual" href="./index.html#/login">Open login form</a></p>
    </div>
    <script>
      var CREDS = { userName: "superadmin", password: "123", orgId: 1, unitId: 1 };
      var statusEl = document.getElementById("status");
      var manualEl = document.getElementById("manual");

      var HMIS_HOME_HASH = "#/configuration/homesortcut";

      function hmisUiBase() {
        var path = location.pathname || "";
        var idx = path.indexOf("/hims-ui");
        if (idx !== -1) return path.slice(0, idx + "/hims-ui".length);
        return "/hims-ui";
      }

      function hmisAppUrlAfterLogin() {
        return hmisUiBase() + "/index.html" + HMIS_HOME_HASH;
      }

      function persistSession(data) {
        if (!data.access_token) throw new Error("No access token");
        localStorage.setItem("access_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("refresh_token", data.refresh_token);
        if (data.expires_at != null) localStorage.setItem("access_expires_at", String(data.expires_at));
        if (data.refresh_expires_at != null) {
          localStorage.setItem("refresh_expires_at", String(data.refresh_expires_at));
        }
        if (data.mstOrg) {
          localStorage.setItem("orgId", data.mstOrg.orgId);
          localStorage.setItem("orgName", data.mstOrg.orgName);
          localStorage.setItem("orgObj", JSON.stringify(data.mstOrg));
        }
        if (data.mstUnit) {
          localStorage.setItem("unitId", data.mstUnit.unitId);
          localStorage.setItem("unitName", data.mstUnit.unitName);
          localStorage.setItem("unitObj", JSON.stringify(data.mstUnit));
        }
        if (data.user_detail) {
          localStorage.setItem("staffId", JSON.stringify(data.user_detail.staffId));
          localStorage.setItem("userdetail", JSON.stringify(data.user_detail));
        }
        if (data.user_action) localStorage.setItem("useraction", JSON.stringify(data.user_action));
        if (data.login_json) localStorage.setItem("login_json", JSON.stringify(data.login_json));
      }

      function finishWithSession(data) {
        persistSession(data);
        statusEl.textContent = "Opening dashboard…";
        location.replace(hmisAppUrlAfterLogin());
      }

      function readJson(res) {
        return res.json().then(function (body) {
          return { ok: res.ok, body: body || {} };
        });
      }

      function loginViaApi() {
        return fetch("/api/hmis-login", {
          method: "GET",
          headers: { Accept: "application/json" },
        })
          .then(readJson)
          .then(function (result) {
            if (result.ok && result.body && result.body.login_status && result.body.access_token) {
              return result;
            }
            if (location.hostname.indexOf("vercel.app") !== -1) return result;
            return loginViaProxy();
          })
          .catch(function () {
            if (location.hostname.indexOf("vercel.app") !== -1) throw new Error("Login failed");
            return loginViaProxy();
          });
      }

      function loginViaProxy() {
        var tenantId = String(CREDS.orgId);
        return fetch(
          "/TATA_postgres/loginaction/session-token?username=" + encodeURIComponent(CREDS.userName),
          { headers: { Accept: "application/json", "X-tenantId": tenantId } }
        )
          .then(readJson)
          .then(function (pre) {
            if (!pre.ok || !pre.body.access_token) {
              throw new Error(pre.body.msg || "HMIS pre-login token was not issued.");
            }
            return fetch("/TATA_postgres/loginaction/authuserlogin/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
                "X-tenantId": tenantId,
                Authorization: "Bearer " + pre.body.access_token,
              },
              body: JSON.stringify(CREDS),
            }).then(readJson);
          });
      }

      var hash = location.hash || "";
      if (hash.indexOf("#portalSession=") === 0) {
        try {
          var encoded = decodeURIComponent(hash.slice("#portalSession=".length));
          finishWithSession(JSON.parse(atob(encoded)));
        } catch (e) {
          console.error(e);
        }
      } else {
        loginViaApi()
          .then(function (result) {
            var data = result.body;
            if (!result.ok || !data || !data.login_status || !data.access_token) {
              throw new Error((data && data.msg) || "Login failed");
            }
            finishWithSession(data);
          })
          .catch(function (err) {
            statusEl.textContent = "Auto sign-in failed. " + (err && err.message ? err.message : "");
            manualEl.textContent = "Sign in manually (superadmin / 123 / CB / TATA MD)";
            console.error(err);
          });
      }
    </script>
  </body>
</html>
